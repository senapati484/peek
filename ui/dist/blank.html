<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New tab</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f7;
        --text: #16181c;
        --muted: #8a909b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101114;
          --text: #f2f3f5;
          --muted: #7d8492;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
      }
      main {
        height: 100%;
        display: grid;
        place-content: center;
        text-align: center;
        gap: 10px;
      }
      .mark {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      kbd {
        padding: 2px 6px;
        border: 1px solid color-mix(in srgb, var(--muted) 35%, transparent);
        border-radius: 5px;
        font-family: inherit;
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Peek</div>
      <p><kbd>Ctrl</kbd>/<kbd>Cmd</kbd> + <kbd>L</kbd> to search or enter an address</p>
    </main>
  </body>
</html>
