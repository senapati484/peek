<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peek</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #09090b;
        --text: #f4f4f5;
        --muted: #71717a;
        --card-bg: rgba(24, 24, 27, 0.6);
        --card-border: rgba(255, 255, 255, 0.08);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f8fafc;
          --text: #0f172a;
          --muted: #64748b;
          --card-bg: rgba(255, 255, 255, 0.8);
          --card-border: rgba(0, 0, 0, 0.08);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, sans-serif;
        overflow: hidden;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        gap: 16px;
      }
      .logo-wrap {
        position: relative;
        display: inline-block;
        margin-bottom: 4px;
      }
      .logo {
        width: 108px;
        height: 108px;
        border-radius: 26px;
        box-shadow: 0 16px 36px -4px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.1);
        display: block;
        user-select: none;
        transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .logo:hover {
        transform: scale(1.04);
      }
      .mark {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin: 0;
      }
      .desc {
        margin: 0;
        color: var(--muted);
        font-size: 13.5px;
        max-width: 320px;
        line-height: 1.4;
      }
      .hints {
        display: flex;
        gap: 16px;
        margin-top: 12px;
      }
      .hint {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        padding: 6px 12px;
        border-radius: 9999px;
        backdrop-filter: blur(8px);
      }
      kbd {
        padding: 2px 6px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--card-border);
        border-radius: 4px;
        font-family: inherit;
        font-size: 11px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo-wrap">
        <img class="logo" src="/logo.png" alt="Peek" />
      </div>
      <h1 class="mark">Peek</h1>
      <p class="desc">Hover to preview. Edge to explore.</p>
      <div class="hints">
        <div class="hint"><kbd>⌘</kbd> + <kbd>L</kbd> Search or type URL</div>
        <div class="hint"><kbd>Shift</kbd> + Hover Live Preview</div>
      </div>
    </main>
  </body>
</html>
