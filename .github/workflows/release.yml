name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag version (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend bundle
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Compile release binaries
        run: |
          cargo build --release -p peek-app --target aarch64-apple-darwin
          cargo build --release -p peek-app --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/Peek \
            target/aarch64-apple-darwin/release/Peek \
            target/x86_64-apple-darwin/release/Peek

      - name: Assemble Peek.app bundle
        run: |
          export SKIP_BUILD=1
          bash scripts/build_app.sh

      - name: Create ZIP archive and DMG
        run: |
          mkdir -p dist
          zip -r -y dist/Peek-macos-universal.zip Peek.app
          cp dist/Peek-macos-universal.zip dist/peek-macos.zip
          STAGING_DIR="/tmp/peek_dmg_staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          cp -R Peek.app "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create -volname "Peek" -srcfolder "$STAGING_DIR" -ov -format UDZO dist/Peek-macos-universal.dmg
          cp dist/Peek-macos-universal.dmg dist/peek.dmg
          cp dist/Peek-macos-universal.dmg dist/peek-arm64.dmg
          rm -rf "$STAGING_DIR"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            dpkg-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend bundle
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Compile release binary
        run: cargo build --release -p peek-app

      - name: Package Linux distribution
        run: |
          export SKIP_BUILD=1
          bash scripts/build_linux.sh
          cp dist/Peek-linux-x86_64.tar.gz dist/peek-linux.tar.gz
          cp dist/peek_*.deb dist/peek.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend bundle
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Compile release binary
        run: cargo build --release -p peek-app

      - name: Package Windows distribution
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1 -SkipBuild
          Copy-Item target\release\Peek.exe dist\peek.exe
          Copy-Item dist\Peek-windows-x86_64.zip dist\peek-windows.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*
          if-no-files-found: error

  publish:
    name: Package Distribution Bundle
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload distribution bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: distribution-v0.1.0
          path: release-assets/*
